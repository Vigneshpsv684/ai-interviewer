<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AI Interviewer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #1e1b4b,
                    #09090f 45%,
                    #050507
                );

            color: white;

            padding: 20px;
        }

        .login-container {

            width: 100%;
            max-width: 430px;

            padding: 36px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.12);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.45);
        }

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .subtitle {

            text-align: center;

            color: #a1a1aa;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 13px 15px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-size: 14px;
        }

        input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.15);
        }

        .error {

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 10px;

            background:
                rgba(239,68,68,0.10);

            border:
                1px solid
                rgba(239,68,68,0.25);

            color: #fca5a5;

            font-size: 13px;
        }

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(139,92,246,0.30);
        }

        .register-link {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #a1a1aa;
        }

        .register-link a {

            color: #a78bfa;

            text-decoration: none;

            font-weight: 600;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            AI <span>Interviewer</span>
        </div>

        <div class="subtitle">
            Login to continue your interview practice
        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
