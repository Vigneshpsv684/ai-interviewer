<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | AI Interviewer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #1e1b4b,
                    #09090f 45%,
                    #050507
                );

            color: #ffffff;

            padding: 20px;
        }

        .register-container {

            width: 100%;
            max-width: 430px;

            padding: 36px;

            border-radius: 22px;

            background:
                rgba(255, 255, 255, 0.06);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.45);
        }

        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .subtitle {

            text-align: center;

            color: #a1a1aa;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #d4d4d8;
        }

        input {

            width: 100%;

            padding: 13px 15px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            background:
                rgba(0, 0, 0, 0.25);

            color: white;

            outline: none;

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139, 92, 246, 0.15);
        }

        input::placeholder {
            color: #71717a;
        }

        .error {

            padding: 12px 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            background:
                rgba(239, 68, 68, 0.10);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);

            color: #fca5a5;

            font-size: 13px;
        }

        .register-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(139, 92, 246, 0.30);
        }

        .login-link {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #a1a1aa;
        }

        .login-link a {

            color: #a78bfa;

            text-decoration: none;

            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .register-container {

                padding: 28px 22px;

            }

        }

    </style>

</head>

<body>

    <div class="register-container">

        <div class="logo">
            AI <span>Interviewer</span>
        </div>

        <div class="subtitle">
            Create your account to start practicing interviews
        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</body>

</html>
